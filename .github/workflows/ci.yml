# lint → test → build → scan → push.
#
# The first two stages are `pnpm verify`, the same command developers run, so a
# green laptop and a green pipeline mean the same thing. The image is built
# from the shipping Dockerfile, scanned, and only then — and only from main or
# a tag — pushed to the registry.
name: CI

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
  # Lets the pipeline be run on demand, which also registers it with Actions
  # while it lives on a branch other than the default one.
  workflow_dispatch:

concurrency:
  # A new push supersedes the run in progress for the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/event-ticketing-api

# Least privilege by default; the image job widens it to push packages.
permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck and test
    # ubuntu-latest ships a running Docker daemon at the default socket, which
    # is all Testcontainers needs for the integration suite.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Enable pnpm
        # The version comes from the `packageManager` field, so it cannot drift
        # from what developers run.
        run: corepack enable pnpm

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # Caches the pnpm store, keyed on the lockfile.
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # lint + typecheck + unit (with coverage thresholds) + integration.
      # Any failure here fails the job, which is what blocks the merge.
      - run: pnpm verify

      - name: Upload coverage
        # Also on failure: the report is most useful when something went wrong.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: apps/api/coverage/
          if-no-files-found: warn

  image:
    name: Build, scan and push the image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      # Only used by the push step, which does not run on pull requests.
      packages: write

    steps:
      - uses: actions/checkout@v4

      # BuildKit: the Dockerfile's `--mount=type=cache` for the pnpm store is
      # not parseable by the legacy builder.
      - uses: docker/setup-buildx-action@v3

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # Every image is addressable by the commit it came from; `latest`
          # follows the default branch, and a v-tag publishes its own version.
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      # Built once and loaded locally so the scan runs on the exact image that
      # would be pushed — not a rebuild of it. The push step below reuses this
      # layer cache, so it costs a manifest, not a second build.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          # Repository root: a pnpm workspace install needs the root lockfile.
          context: .
          file: apps/api/Dockerfile
          load: true
          tags: ${{ env.IMAGE }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The gate. HIGH and CRITICAL fail the pipeline; anything with no fix
      # available yet is not actionable, and an accepted CVE goes in
      # .trivyignore with a dated reason beside it.
      #
      # The ref needs its `v`: trivy-action tags releases `v0.36.0`, and a bare
      # `0.28.0` is not a tag it has — Actions fails the job at resolution time
      # with "unable to find version", before a single step runs.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore

      - name: Save the scan report
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:ci
          format: json
          output: trivy-report.json
          severity: HIGH,CRITICAL,MEDIUM
          # Reporting, not gating: this one records what was found either way.
          exit-code: '0'

      - name: Upload the scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json
          if-no-files-found: warn

      # Everything below publishes, so it is skipped on pull requests: a fork
      # PR must never be able to push an image.
      - name: Log in to the registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Provided by Actions; no long-lived registry credential is stored.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Same cache as the scanned build: this republishes those layers
          # rather than compiling anything again.
          cache-from: type=gha
